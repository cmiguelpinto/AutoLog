.oilStatus{display:block}
.oilInfo{width:100%;min-width:0}
.oilStatusTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.oilBadge{display:inline-flex;align-items:center;justify-content:center;padding:5px 9px;border-radius:999px;background:#e8f8ef;color:#137947;font-size:11px;font-weight:950;white-space:nowrap}
.oilBadge.due{background:#fff7d9;color:#9a6700}
.oilBadge.overdue{background:#ffecef;color:#c92f42}
.oilProgress{height:8px;background:#edf0f6;border-radius:999px;margin-top:12px;overflow:hidden}
.oilProgress div{height:100%;border-radius:999px;background:linear-gradient(90deg,#7dd3fc,#00d7ff)}
.oilProgress div.due{background:linear-gradient(90deg,var(--yellow),#f59e0b)}
.oilProgress div.overdue{background:var(--red)}
.oilCardActions{margin-top:12px;display:flex;gap:8px}
.oilCardActions .small{font-size:12px;padding:8px 12px}
.oilMetaRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.oilMeta{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f4f7fb;color:#596078;font-size:12px;font-weight:900}
.oilNext{margin-top:8px}


/* Fuel history cards v16 */
.fuelList{display:grid;gap:12px;padding:12px;background:transparent;box-shadow:none;border:0}
.fuelCard{background:linear-gradient(180deg,#fff,#f8faff);border:1px solid #edf1f8;border-radius:22px;padding:14px;box-shadow:0 10px 24px rgba(16,19,27,.06)}
.fuelCardTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fuelStation{font-size:16px;font-weight:950;letter-spacing:-.2px}
.fuelDate{font-size:12px;color:var(--muted);font-weight:800;margin-top:3px}
.fuelTotal{font-size:24px;font-weight:950;text-align:right;white-space:nowrap;color:var(--dark)}
.fuelTotal span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:1px}
.fuelMetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fuelMetric{background:#f3f6fb;border:1px solid #e8edf6;border-radius:16px;padding:9px 8px;min-width:0}
.fuelMetric span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#788198;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fuelMetric strong{display:block;margin-top:3px;font-size:15px;font-weight:950;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fuelTags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.fuelTag{display:inline-flex;align-items:center;gap:4px;padding:6px 9px;border-radius:999px;background:#eef3fb;color:#536079;font-size:11px;font-weight:950}
.fuelTag.full{background:#e8f8ef;color:#137947}
.fuelTag.partial{background:#fff7d9;color:#9a6700}
.fuelTag.carAvg{background:#edf6ff;color:#1d65b8}
.fuelTag.eco{background:#eafaf7;color:#047060}
.fuelTag.discount{background:#f1edff;color:#6d45c6}
.fuelCardActions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #edf1f8}
.fuelCardActions .small{padding:8px 12px}
@media(max-width:390px){.fuelMetrics{grid-template-columns:1fr 1fr}.fuelTotal{font-size:21px}}

/* UX polish v3 */
:root{--soft:#f4f6fb;--ok:#19a66a;--warn:#f59e0b;--danger:#d74252}
button{transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease}button:active{transform:scale(.97)}
.icon[title],.quick[title]{position:relative}.helpText{font-size:12px;color:var(--muted);line-height:1.45;font-weight:750}
.action{position:relative;min-height:72px;display:flex;flex-direction:column;justify-content:center;align-items:center}.action:hover,.head button:hover,.small:hover{box-shadow:0 8px 20px rgba(16,19,27,.10)}
.action.primaryAction{background:linear-gradient(180deg,var(--yellow),#f4b93f);color:#111}.action.oilAction{background:linear-gradient(180deg,#e7fbff,#fff);color:#0f647b}

.form .btn{margin-top:2px}.field input:focus,.field select:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(247,201,72,.18);background:#fff}
.alertStrip{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:16px;background:#fff8df;border:1px solid #ffe8a3;color:#7a5200;font-size:12px;font-weight:850;line-height:1.35}.alertStrip.ok{background:#eaf8f0;border-color:#c8f0d8;color:#11623b}.alertStrip.danger{background:#fff0f2;border-color:#ffd1d8;color:#a02535}

.importLabel{width:40px;height:40px;border-radius:15px;background:rgba(255,255,255,.1);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer}.importLabel input{display:none}
@media(min-width:900px){.actions{grid-template-columns:repeat(5,1fr)}.content{display:grid;grid-template-columns:1fr 1fr;align-items:start}.content>.head,.content>.actions,.content>.sectionIntro,.content>.costHero{grid-column:1/-1}.card.list{max-height:520px;overflow:auto}.backTop{right:calc(50% - 560px);bottom:24px}}

/* Quick action buttons without icons */
.actions .action{display:flex;align-items:center;justify-content:center;min-height:54px;padding:13px 6px;font-size:12px;}
.actions .action b{display:none;}

/* Compact document cards */
.docGrid{gap:8px}
.docCard{padding:11px 12px;border-radius:18px;box-shadow:0 7px 18px rgba(16,19,27,.06);border:1px solid transparent}
.docCard .sub{font-size:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.08em;font-weight:950}
.docCard .main{font-size:18px;line-height:1.05;margin-top:2px}
.docCard .docExpire{font-size:11px;margin-top:5px;font-weight:900}
.docOk{background:#eaf8f0;border-color:#c8f0d8;color:#11623b}
.docOk .sub,.docOk .docExpire{color:#137947}
.docWarn{background:#fff8df;border-color:#ffe8a3;color:#8a5b00}
.docWarn .sub,.docWarn .docExpire{color:#9a6700}
.docDanger{background:#fff0f2;border-color:#ffd1d8;color:#a02535}

.infoNote{background:#f7f8fb;border:1.5px dashed #d7dde8;border-radius:16px;padding:12px;color:#687086;font-size:12px;font-weight:780;line-height:1.35}

<body>
<div class="app"><header class="top"><div class="status"><div class="brand"><div class="logo">🚗</div><div><h1>AutoLog</h1><span>Car management · by Carlos Pinto</span></div></div><div style="display:flex;gap:8px"><button class="icon" title="Reset" onclick="resetApp()">↺</button><label class="importLabel" title="Importar backup">⬆<input type="file" accept="application/json" onchange="importData(event)"></label><button class="icon" title="Exportar backup" onclick="exportData()">⬇</button></div></div><div class="pills" id="carPills"></div><div class="hero"><div class="heroTitle"><div id="heroLogo" class="brandLogo">CAR</div><div><div class="carName" id="heroName"></div><div class="carMeta" id="heroMeta"></div></div></div><div id="heroPlate"></div><div class="odoRow"><div><div class="label">Odómetro</div><div class="odo" id="heroOdo"></div></div><button class="quick" onclick="showScreen('garage')">Configurar</button></div><div class="topStats"><div class="mini"><span>Total</span><strong class="yellow" id="topTotal"></strong></div><div class="mini"><span>Litros</span><strong id="topLiters"></strong></div><div class="mini"><span>L/100</span><strong class="green" id="topAvg"></strong></div></div></div></header><main class="content" id="content"></main><nav class="tabs"><button id="tab-overview" class="tab active" onclick="showScreen('overview')">Resumo</button><button id="tab-fuel" class="tab" onclick="showScreen('fuel')">Fuel</button><button id="tab-service" class="tab" onclick="showScreen('service')">Serviço</button><button id="tab-costs" class="tab" onclick="showScreen('costs')">Custos</button><button id="tab-garage" class="tab" onclick="showScreen('garage')">Garagem</button></nav><button class="backTop" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button><div class="toast" id="toast"></div></div>
<script>
const KEY='autolog_local_latest_download';let current='overview',openKm=false,openOil=false,openFuelForm=false,openServiceForm=false,openExtraForm=false,editingOilId=null,editingFuelId=null,costMonthFilter='all',costTypeFilter='all',costCarFilter='all',costChartMetric='spend';
const makeDefault=()=>({active:'car1',cars:[{id:'car1',brand:'BMW',model:'X1',year:'',fuel:'Diesel',color:'#f7c948',plate:'',regMonth:'',odo:0,insurance:'',inspection:'',iuc:'',insuranceValue:0,inspectionValue:0,iucValue:0,oilIntervalKm:1000,oilType:'5W30'}],fuel:[],service:[],extras:[],kmLogs:[],oilLogs:[]});
let S=load();const carCatalog={BMW:['X1','X2','X3','X5','Série 1','Série 3','Série 5'],'Mercedes-Benz':['Classe A','Classe C','Classe E','GLA','GLC'],Audi:['A1','A3','A4','Q3','Q5'],Volkswagen:['Polo','Golf','Passat','T-Roc','Tiguan'],Toyota:['Yaris','Corolla','C-HR','RAV4'],Renault:['Clio','Captur','Mégane','Scénic'],Peugeot:['208','308','2008','3008'],Ford:['Fiesta','Focus','Puma','Kuga'],Nissan:['Micra','Juke','Qashqai'],Other:['Other']};
const serviceNames=['Óleo Motor','Filtro Óleo Motor','Filtro Ar','Injectores','Filtro AC','Filtro Habitáculo','Pastilhas','Travões','Escovas','Pneus','Velas'];const extraNames=[['inj','Limpa Injectores Diesel'],['dpf','Aditivo Filtro de Partículas'],['motor','Aditivo Tratamento Motor Diesel']];
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));let d=makeDefault();s=Object.assign(d,s||{});s.cars=s.cars||d.cars;s.fuel=s.fuel||[];s.service=s.service||[];s.extras=s.extras||[];s.kmLogs=s.kmLogs||[];s.oilLogs=s.oilLogs||[];s.cars.forEach(c=>{c.color=c.color||'#f7c948';c.insuranceValue=Number(c.insuranceValue||0);c.inspectionValue=Number(c.inspectionValue||0);c.iucValue=Number(c.iucValue||0);c.oilIntervalKm=Number(c.oilIntervalKm||1000);c.oilType=c.oilType||'5W30'});s.fuel.forEach(f=>{if(typeof f.fullTank==='undefined')f.fullTank=true;f.savedKm=Number(f.savedKm||0);f.carAvg=Number(f.carAvg||0)});return s}catch{return makeDefault()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(m){toastEl=document.getElementById('toast');toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1600)}function shortMoney(n){return Number(n||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' €'}function money(n){return Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}function km(n){return Number(n||0).toLocaleString('pt-PT')}function today(){return new Date().toISOString().slice(0,10)}function val(id){return String(document.getElementById(id)?.value||'').trim()}function num(id){let n=parseFloat(val(id).replace(',','.'));return Number.isFinite(n)?n:0}function fmtDate(d){if(!d)return'—';let p=String(d).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}function addOneYear(d){if(!d)return'';let p=String(d).split('-').map(Number);if(p.length!==3||p.some(n=>!Number.isFinite(n)))return'';let nd=new Date(p[0]+1,p[1]-1,p[2]);return nd.toISOString().slice(0,10)}function daysTo(d){return d?Math.ceil((new Date(d)-new Date())/86400000):null}function isAll(){return S.active==='all'}function car(){return S.cars.find(x=>x.id===S.active)||S.cars[0]}function rows(t){return isAll()?S[t]:(S[t]||[]).filter(x=>x.carId===car()?.id)}function fuels(){return rows('fuel')}function services(){return rows('service')}function extras(){return rows('extras')}function logs(){return rows('kmLogs')}function oilLogs(){return rows('oilLogs')}function accentForCar(c){let f=String(c?.fuel||'').toLowerCase();return(f.includes('híbrido')||f.includes('hibrido')||f.includes('elétrico')||f.includes('eletrico'))?'#00d7ff':(c?.color||'#f7c948')}function calcFuelConsumptionMap(list=fuels()){
  // Estimated average for EVERY refill:
  // liters added in this refill / km since previous refill * 100.
  // Full-cycle average is still available when a full tank closes a cycle.
  let sorted=[...list].filter(x=>Number(x.odo||0)>0).sort((a,b)=>Number(a.odo)-Number(b.odo)),map={};
  for(let i=0;i<sorted.length;i++){
    let current=sorted[i],currentOdo=Number(current.odo||0),liters=Number(current.liters||0);
    let prevAny=null;
    for(let j=i-1;j>=0;j--){if(Number(sorted[j].odo||0)<currentOdo){prevAny=sorted[j];break;}}
    let base={estimateValid:false,cycleValid:false,fullTank:current.fullTank!==false};
    if(prevAny){
      let distance=currentOdo-Number(prevAny.odo||0);
      if(distance>0&&liters>0){
        let estimateAvg=liters/distance*100;
        Object.assign(base,{estimateValid:true,estimateDistance:distance,estimateLiters:liters,estimateAvg,estimateWarning:(estimateAvg<2||estimateAvg>12),prevAnyOdo:Number(prevAny.odo||0)});
      }
    }
    if(current.fullTank!==false){
      let prevFull=null;
      for(let j=i-1;j>=0;j--){if(sorted[j].fullTank!==false&&Number(sorted[j].odo||0)<currentOdo){prevFull=sorted[j];break;}}
      if(prevFull){
        let cycleDistance=currentOdo-Number(prevFull.odo||0);
        let included=sorted.filter(e=>Number(e.odo||0)>Number(prevFull.odo||0)&&Number(e.odo||0)<=currentOdo);
        let cycleLiters=included.reduce((a,e)=>a+Number(e.liters||0),0);
        let partials=included.filter(e=>String(e.id)!==String(current.id)&&e.fullTank===false);
        if(cycleDistance>0&&cycleLiters>0){
          let cycleAvg=cycleLiters/cycleDistance*100;
          Object.assign(base,{cycleValid:true,cycleDistance,cycleLiters,cycleAvg,prevFullOdo:Number(prevFull.odo||0),partialLiters:partials.reduce((a,e)=>a+Number(e.liters||0),0),partialCount:partials.length,cycleWarning:(cycleAvg<2||cycleAvg>12)});
        }
      }
    }
    map[current.id]=base;
  }
  return map;
}
function previousFuelBefore(odo,ignoreId=null){
  let n=Number(odo||0);
  return [...fuels()].filter(x=>String(x.id)!==String(ignoreId||'')&&Number(x.odo||0)>0&&Number(x.odo)<n).sort((a,b)=>Number(b.odo)-Number(a.odo))[0]||null;
}
function previousFullFuelBefore(odo,ignoreId=null){
  let n=Number(odo||0);
  return [...fuels()].filter(x=>String(x.id)!==String(ignoreId||'')&&x.fullTank!==false&&Number(x.odo||0)>0&&Number(x.odo)<n).sort((a,b)=>Number(b.odo)-Number(a.odo))[0]||null;
}
function partialFuelBetween(prevOdo,odo,ignoreId=null){
  let a=Number(prevOdo||0),b=Number(odo||0);
  return [...fuels()].filter(x=>String(x.id)!==String(ignoreId||'')&&x.fullTank===false&&Number(x.odo||0)>a&&Number(x.odo||0)<b);
}
function totals(){
  let f=fuels(),s=services(),x=extras(),fuel=f.reduce((a,b)=>a+Number(b.total||0),0),lit=f.reduce((a,b)=>a+Number(b.liters||0),0),saved=f.reduce((a,b)=>a+Number(b.saved||0),0),serv=s.reduce((a,b)=>a+Number(b.cost||0),0),ext=x.reduce((a,b)=>a+Number(b.cost||0),0),ecoKm=f.reduce((a,b)=>a+Number(b.savedKm||0),0),carAvgEntries=f.filter(b=>Number(b.carAvg||0)>0),lastCarAvg=(carAvgEntries[0]?Number(carAvgEntries[0].carAvg||0):0),avgCarAvg=(carAvgEntries.length?carAvgEntries.reduce((a,b)=>a+Number(b.carAvg||0),0)/carAvgEntries.length:0);
  let sorted=[...f].sort((a,b)=>Number(b.odo||0)-Number(a.odo||0)),map=calcFuelConsumptionMap(f);
  let estimateSegments=Object.values(map).filter(m=>m.estimateValid),estLiters=estimateSegments.reduce((a,b)=>a+Number(b.estimateLiters||0),0),estDistance=estimateSegments.reduce((a,b)=>a+Number(b.estimateDistance||0),0),avg=estDistance?estLiters/estDistance*100:0;
  let latestEstimate=sorted.find(e=>map[e.id]&&map[e.id].estimateValid),lastAvg=latestEstimate?map[latestEstimate.id].estimateAvg:0,lastDistance=latestEstimate?map[latestEstimate.id].estimateDistance:0;
  let cycleSegments=Object.values(map).filter(m=>m.cycleValid),cycleLiters=cycleSegments.reduce((a,b)=>a+Number(b.cycleLiters||0),0),cycleDistance=cycleSegments.reduce((a,b)=>a+Number(b.cycleDistance||0),0),cycleAvg=cycleDistance?cycleLiters/cycleDistance*100:0;
  let latestCycle=sorted.find(e=>map[e.id]&&map[e.id].cycleValid),lastCycleAvg=latestCycle?map[latestCycle.id].cycleAvg:0,lastCycleDistance=latestCycle?map[latestCycle.id].cycleDistance:0;
  return{fuel,liters:lit,saved,service:serv,extras:ext,total:fuel+serv+ext,avg,lastAvg,lastDistance,cycleAvg,lastCycleAvg,lastCycleDistance,ecoKm,lastCarAvg,avgCarAvg};
}
function carLogoText(b){return({BMW:'BMW','Mercedes-Benz':'MB',Audi:'AUDI',Volkswagen:'VW',Toyota:'TOY',Renault:'REN',Peugeot:'PEU',Ford:'FORD',Nissan:'NIS'}[b]||String(b||'CAR').slice(0,4).toUpperCase())}function plateHTML(c){if(!c?.plate)return'<div class="emptyPlate">Sem matrícula definida</div>';let raw=c.plate.toUpperCase().replace(/[^A-Z0-9]/g,''),code=raw.length===6?`${raw.slice(0,2)}-${raw.slice(2,4)}-${raw.slice(4,6)}`:c.plate.toUpperCase(),yy=String(c.year||'').slice(-2).padStart(2,'0'),mm=String(c.regMonth||'').padStart(2,'0');return`<div class="plate"><div class="p">P</div><div class="code">${code}</div><div class="date"><span>${yy}</span><span>${mm}</span></div></div>`}
function renderTop(){let c=car(),t=totals();document.querySelector('.top').style.setProperty('--accentBall',isAll()?'#f7c948':accentForCar(c));carPills.innerHTML=`<button class="pill ${isAll()?'active':''}" onclick="S.active='all';save();render()">Garage</button>`+S.cars.map(x=>`<button class="pill ${S.active===x.id?'active':''}" onclick="S.active='${x.id}';save();render()">${(x.brand||x.model)?`${x.brand} ${x.model}`:'Novo carro'}</button>`).join('');if(isAll()){heroLogo.textContent='GAR';heroName.textContent='Garage';heroMeta.textContent=`${S.cars.length} carros · resumo geral`;heroPlate.innerHTML='<div class="emptyPlate">Todos os carros</div>';heroOdo.innerHTML=`${S.cars.length} <small>cars</small>`}else{heroLogo.textContent=carLogoText(c.brand);heroName.textContent=(c.brand||c.model)?`${c.brand} ${c.model}`:'Configura o teu carro';heroMeta.textContent=[c.year,c.fuel].filter(Boolean).join(' · ')||'Dados por preencher';heroPlate.innerHTML=plateHTML(c);heroOdo.innerHTML=`${c.odo?km(c.odo):'—'} <small>km</small>`}topTotal.textContent=shortMoney(t.total);topLiters.textContent=Math.round(t.liters)+' L';topAvg.textContent=(t.lastAvg||t.avg)?(t.lastAvg||t.avg).toFixed(1):'—'}function setTab(){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+current)?.classList.add('active')}function showScreen(s){current=s;openKm=openOil=openFuelForm=openServiceForm=openExtraForm=false;editingOilId=null;render()}function docClassByDays(days){if(days===null)return'docUnset';if(days<10)return'docDanger';if(days<30)return'docWarn';return'docOk'}function docCard(n,d,v=0){if(!d)return`<div class="card docCard docUnset"><div class="sub">${n}</div><div class="main">—</div><div class="docExpire">Sem validade</div></div>`;let expiry=addOneYear(d),days=daysTo(expiry),cls=docClassByDays(days),status=days<0?'Expirado':days===0?'Hoje':days+' dias';return`<div class="card docCard ${cls}"><div class="sub">${n}</div><div class="main">${status}</div><div class="docExpire">Expira: ${fmtDate(expiry)}</div></div>`}function savingCard(v){return`<div class="card docCard docOk"><div class="sub">Poupança</div><div class="main">${shortMoney(v)}</div><div class="docExpire">Descontos fuel</div></div>`}

function oilLevelOptions(selected){return ['Min','Low','OK','High','Overfilled'].map(x=>`<option value="${x}" ${x===selected?'selected':''}>${x}</option>`).join('')}
function oilTypeOptions(selected){return ['5W30','5W40','0W30','0W20','10W40','Other'].map(x=>`<option value="${x}" ${x===selected?'selected':''}>${x}</option>`).join('')}
function lastOilLog(){return [...oilLogs()].sort((a,b)=>Number(b.odo||0)-Number(a.odo||0))[0]||null}
function oilDueData(){const c=car();const last=lastOilLog();const interval=Number(c?.oilIntervalKm||1000);const lastOdo=Number(last?.odo||0);const currentOdo=Number(c?.odo||0);const next=lastOdo?lastOdo+interval:currentOdo;const remaining=lastOdo?next-currentOdo:0;return{last,interval,lastOdo,currentOdo,next,remaining}}
function oilStatusCard(){if(isAll())return'';const d=oilDueData();const hasLast=!!d.last;let badge='Sem check',cls='',statusTitle='Ainda sem controlo',mainText='Regista o primeiro check para ativar o alerta.',nextText='A contagem começa depois do primeiro registo.';let remainingPct=100;if(hasLast){remainingPct=Math.max(0,Math.min(100,Math.round((d.remaining/d.interval)*100)));statusTitle=`${escapeHtml(d.last.level)} · ${km(d.last.odo)} km`;if(d.remaining<0){badge='Atrasado';cls='overdue';mainText=`Passou ${km(Math.abs(d.remaining))} km do limite definido.`;nextText=`Último check: ${fmtDate(d.last.date)} · alvo era ${km(d.next)} km.`}else if(d.remaining<=100){badge='Quase na hora';cls='due';mainText=`Faltam ${km(d.remaining)} km para o próximo check.`;nextText=`Último check: ${fmtDate(d.last.date)} · próximo alvo ${km(d.next)} km.`}else{badge='OK';mainText=`Faltam ${km(d.remaining)} km para o próximo check.`;nextText=`Último check: ${fmtDate(d.last.date)} · próximo alvo ${km(d.next)} km.`}}return`<div class="head"><h2>Oil Level</h2><button onclick="openOilBox()">Check now</button></div><div class="card oilStatus"><div class="oilInfo"><div class="oilStatusTop"><div><div class="main">${statusTitle}</div><div class="sub">${mainText}</div></div><span class="oilBadge ${cls}">${badge}</span></div><div class="oilMetaRow"><span class="oilMeta">Intervalo: ${km(d.interval)} km</span>${hasLast?`<span class="oilMeta">Próximo: ${km(d.next)} km</span>`:''}</div><div class="oilProgress"><div class="${cls}" style="width:${hasLast?remainingPct:100}%"></div></div><div class="sub oilNext">${nextText}</div><div class="oilCardActions"><button class="small" onclick="openOilBox()">Registar check</button>${hasLast?`<button class="small" onclick="editOilLog('${d.last.id}')">Edit last</button>`:''}</div></div></div>`}
function oilTimeline(){const a=[...oilLogs()].sort((x,y)=>(y.date||'').localeCompare(x.date||'')).slice(0,6);return`<div class="head"><h2>Oil Timeline</h2>${a.length?`<button>${a.length} registos</button>`:''}</div><div class="card list scrollList">${a.length?a.map(x=>`<div class="item"><div><div class="main">${fmtDate(x.date)} · ${km(x.odo)} km</div><div class="sub">Level: ${escapeHtml(x.level)}${x.added?` · Added: ${x.quantity} L · ${escapeHtml(x.oilType)}`:' · No oil added'}${x.comment?` · ${escapeHtml(x.comment)}`:''}</div><div class="itemActions"><button class="small" onclick="editOilLog('${x.id}')">Edit</button><button class="small red" onclick="removeFrom('oilLogs','${x.id}')">Remover</button></div></div></div>`).join(''):'<div class="empty">Sem controlos de óleo</div>'}</div>`}
function oilForm(){if(isAll())return'';let c=car(),editing=S.oilLogs.find(x=>String(x.id)===String(editingOilId));let isEdit=!!editing;let added=!!editing?.added;return`<div class="card form ${openOil?'':'collapsed'}"><div class="sub">${isEdit?'Editing oil check':'New oil check'}</div><div class="row"><div class="field"><label>Data</label><input id="oilDate" type="date" value="${editing?.date||today()}"></div><div class="field"><label>KM do check</label><input id="oilOdo" type="number" value="${editing?.odo||c.odo||''}"></div></div><div class="field"><label>Oil level</label><select id="oilLevel">${oilLevelOptions(editing?.level||'OK')}</select></div><label class="check"><input id="oilAdded" type="checkbox" onchange="toggleOilAdded()" ${added?'checked':''}> Adicionei óleo?</label><div id="oilAddedBox" class="${added?'':'collapsed'}"><div class="row"><div class="field"><label>Quantidade adicionada L</label><input id="oilQty" type="number" step="0.1" placeholder="ex: 0.5" value="${editing?.quantity||''}"></div><div class="field"><label>Tipo de óleo</label><select id="oilType">${oilTypeOptions(editing?.oilType||c.oilType||'5W30')}</select></div></div></div><div class="field"><label>Comentário</label><input id="oilComment" placeholder="ex: depois de viagem longa" value="${escapeHtml(editing?.comment||'')}"></div><div class="sub">${isEdit?'Corrige o registo guardado por engano.':'Podes verificar antes do intervalo. Ao guardar, este KM passa a ser a nova referência do próximo alerta.'}</div><button class="btn" onclick="saveOilLog()">${isEdit?'Guardar alterações':'Guardar Oil Check'}</button>${isEdit?`<button class="small" style="width:100%;margin-top:8px" onclick="cancelOilEdit()">Cancelar edição</button>`:''}</div>`}

function monthLabel(v){if(v==='all')return'Todos os meses';let [y,m]=v.split('-'),n=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];return`${n[Number(m)-1]} ${y}`}function setCostMonth(v){costMonthFilter=v;render()}function setCostType(v){costTypeFilter=v;render()}function setCostCar(v){costCarFilter=v;render()}function carLabelById(id){let c=S.cars.find(x=>String(x.id)===String(id));return c?((c.brand||c.model)?`${c.brand} ${c.model}`:'Novo carro'):'Carro'}
function setCostChartMetric(v){costChartMetric=v;render()}
function costMetricChart(events){
let metric=costChartMetric||'spend';
let useDay=costMonthFilter!=='all';
let keys=[...new Set(events.filter(e=>e.d).map(e=>useDay?String(e.d).slice(0,10):String(e.d).slice(0,7)))].sort();
if(keys.length>8)keys=keys.slice(-8);
let rows=keys.map(k=>{let items=events.filter(e=>String(e.d||'').startsWith(k));let fuel=items.filter(e=>e.type==='fuel');let spend=items.reduce((a,b)=>a+Number(b.a||0),0);let liters=fuel.reduce((a,b)=>a+Number(b.liters||0),0);let fuelCost=fuel.reduce((a,b)=>a+Number(b.a||0),0);let saved=fuel.reduce((a,b)=>a+Number(b.savedKm||0),0);let value=metric==='fuel'?(liters?fuelCost/liters:0):metric==='saved'?saved:spend;return{k,items,value}}).filter(r=>r.value>0||r.items.length>0);
let title=metric==='fuel'?'Fuel €/L':metric==='saved'?'Km poupados':'Gastos';
let unit=metric==='fuel'?'€/L':metric==='saved'?'km':'€';
let total=metric==='fuel'?(()=>{let f=events.filter(e=>e.type==='fuel'),l=f.reduce((a,b)=>a+Number(b.liters||0),0),c=f.reduce((a,b)=>a+Number(b.a||0),0);return l?c/l:0})():metric==='saved'?events.filter(e=>e.type==='fuel').reduce((a,b)=>a+Number(b.savedKm||0),0):events.reduce((a,b)=>a+Number(b.a||0),0);
let display=metric==='fuel'?(total?total.toFixed(3)+' €/L':'—'):metric==='saved'?(total?Number(total).toFixed(1)+' km':'—'):shortMoney(total);
let toggles=`<div class="metricToggle"><button class="${metric==='spend'?'active':''}" onclick="setCostChartMetric('spend')">Gastos</button><button class="${metric==='fuel'?'active':''}" onclick="setCostChartMetric('fuel')">Fuel €/L</button><button class="${metric==='saved'?'active':''}" onclick="setCostChartMetric('saved')">Km poupados</button></div>`;
if(!rows.length)return`<div class="metricChartCard"><div class="metricChartTop"><div><span>${title}</span><strong>—</strong></div>${toggles}</div><div class="metricEmpty">Sem dados suficientes para gráfico.</div></div>`;
let W=360,H=160,pad=20,max=Math.max(...rows.map(r=>r.value)),min=Math.min(...rows.map(r=>r.value));if(max===min){min=0;max=max||1}
let pts=rows.map((r,i)=>{let x=rows.length===1?W/2:pad+i*((W-2*pad)/(rows.length-1));let y=H-pad-((r.value-min)/(max-min))*(H-2*pad);return{x,y,r}});
let line=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
let area=`${pad},${H-pad} ${line} ${W-pad},${H-pad}`;
let peak=pts.reduce((a,b)=>b.r.value>a.r.value?b:a,pts[0]);let low=pts.reduce((a,b)=>b.r.value<a.r.value?b:a,pts[0]);
let fmt=v=>metric==='fuel'?Number(v).toFixed(3):metric==='saved'?Number(v).toFixed(1):shortMoney(v).replace(' €','');
let labels=rows.map(r=>useDay?fmtDate(r.k).slice(0,5):monthLabel(r.k).split(' ')[0].slice(0,3)).join('</span><span>');
return`<div class="metricChartCard"><div class="metricChartTop"><div><span>${title}</span><strong>${display}</strong></div>${toggles}</div><svg class="metricSvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="costArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#7dd3fc" stop-opacity=".75"/><stop offset="100%" stop-color="#99f6e4" stop-opacity=".28"/></linearGradient></defs><path d="M ${area}" fill="url(#costArea)"></path><polyline points="${line}" fill="none" stroke="#22c7d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#20d6c7" stroke="#fff" stroke-width="3"></circle>`).join('')}<foreignObject x="${Math.min(W-86,Math.max(6,peak.x-38))}" y="${Math.max(4,peak.y-30)}" width="80" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="metricPointLabel">${fmt(peak.r.value)} ${unit}</div></foreignObject>${low!==peak?`<foreignObject x="${Math.min(W-86,Math.max(6,low.x-38))}" y="${Math.min(H-28,low.y+10)}" width="80" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="metricPointLabel">${fmt(low.r.value)} ${unit}</div></foreignObject>`:''}</svg><div class="metricAxis"><span>${labels}</span></div><div class="metricHint">${useDay?'Evolução diária dentro do mês escolhido.':'Evolução mensal dos últimos períodos com dados.'}</div></div>`}

...services().map(x=>({type:'service',carId:x.carId,d:x.date,n:x.title||'Serviço',s:[km(x.odo)+' km',x.garage].filter(Boolean).join(' · '),car:carLabelById(x.carId),a:x.cost,odo:x.odo,meta:x.next?[`Próximo ${km(x.next)} km`]:[]})),

],docs=[];
selectedCars.forEach(c=>{let cn=(c.brand||c.model)?`${c.brand} ${c.model}`:'Carro';if(c.insurance&&+c.insuranceValue>0)docs.push({type:'docs',carId:c.id,d:c.insurance,n:'Seguro',s:`Expira ${fmtDate(addOneYear(c.insurance))}`,car:cn,a:+c.insuranceValue,meta:['Documento']});if(c.inspection&&+c.inspectionValue>0)docs.push({type:'docs',carId:c.id,d:c.inspection,n:'Inspeção',s:`Expira ${fmtDate(addOneYear(c.inspection))}`,car:cn,a:+c.inspectionValue,meta:['Documento']});if(c.iuc&&+c.iucValue>0)docs.push({type:'docs',carId:c.id,d:c.iuc,n:'IUC',s:`Expira ${fmtDate(addOneYear(c.iuc))}`,car:cn,a:+c.iucValue,meta:['Documento']})});
let all=[...base,...docs].sort((a,b)=>(b.d||'').localeCompare(a.d||''));
let months=[...new Set(all.filter(e=>e.d).map(e=>String(e.d).slice(0,7)))].sort().reverse();

let events=all.filter(e=>(!isAll()||costCarFilter==='all'||String(e.carId)===String(costCarFilter))&&(costMonthFilter==='all'||String(e.d||'').slice(0,7)===costMonthFilter)&&(costTypeFilter==='all'||e.type===costTypeFilter));
let total=events.reduce((a,b)=>a+Number(b.a||0),0),fuelTotal=events.filter(e=>e.type==='fuel').reduce((a,b)=>a+Number(b.a||0),0),serviceTotal=events.filter(e=>e.type==='service').reduce((a,b)=>a+Number(b.a||0),0),docTotal=events.filter(e=>e.type==='docs').reduce((a,b)=>a+Number(b.a||0),0),liters=events.filter(e=>e.type==='fuel').reduce((a,b)=>a+Number(b.liters||0),0);
let avgTicket=events.length?total/events.length:0,avgFuel=liters?fuelTotal/liters:0;
let summary=`<div class="costMiniSummary"><div class="costMini primary"><span>Total</span><strong>${shortMoney(total)}</strong></div><div class="costMini"><span>Registos</span><strong>${events.length}</strong></div><div class="costMini"><span>Fuel €/L</span><strong>${avgFuel?avgFuel.toFixed(3):'—'}</strong></div><div class="costMini"><span>Ticket médio</span><strong>${avgTicket?shortMoney(avgTicket):'—'}</strong></div></div>`;
if(!all.length)return`<div class="head"><h2>Custos</h2></div>${filters}<div class="card"><div class="empty">Ainda não existem gastos registados.</div></div>`;
if(!events.length)return`<div class="head"><h2>Custos</h2></div>${filters}${summary}<div class="card"><div class="empty">Sem resultados para os filtros escolhidos.</div></div>`;
let icon=t=>({fuel:'⛽',service:'🔧',extra:'＋',docs:'📄'}[t]||'•'),label=t=>({fuel:'Fuel',service:'Serviço',extra:'Extra',docs:'Documento'}[t]||t);
let grouped={};events.forEach(e=>{let k=e.d||'Sem data';(grouped[k]=grouped[k]||[]).push(e)});
let timeline=Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).map(day=>{let dayTotal=grouped[day].reduce((a,b)=>a+Number(b.a||0),0);return`<div class="chronoDay"><strong>${fmtDate(day)}</strong><span>${shortMoney(dayTotal)}</span></div>`+grouped[day].map(e=>`<div class="chronoCard"><div class="chronoIcon ${e.type}">${icon(e.type)}</div><div class="chronoMain"><div class="chronoTitle">${escapeHtml(e.n)}</div><div class="chronoSub">${isAll()?escapeHtml(e.car)+' · ':''}${escapeHtml(e.s||'')}</div><div class="chronoTags"><span class="chronoTag">${label(e.type)}</span>${(e.meta||[]).map(m=>`<span class="chronoTag">${escapeHtml(m)}</span>`).join('')}</div></div><div class="chronoMoney">${shortMoney(e.a)}<small>${e.type==='fuel'&&e.liters?Number(e.liters).toFixed(1)+' L':''}</small></div></div>`).join('')}).join('');
return`<div class="head"><h2>Custos</h2></div>${filters}${summary}${costMetricChart(events)}<div class="head"><h2>Lista cronológica</h2><button>${events.length} registos</button></div><div class="chronoList">${timeline}</div>`}
function brandOptions(s){return Object.keys(carCatalog).map(b=>`<option value="${b}" ${b===s?'selected':''}>${b}</option>`).join('')}function modelOptions(b,s){return(carCatalog[b]||['Other']).map(m=>`<option value="${m}" ${m===s?'selected':''}>${m}</option>`).join('')}function yearOptions(s){let out='<option value="">Ano</option>',y=new Date().getFullYear()+1;for(;y>=1980;y--)out+=`<option value="${y}" ${String(y)===String(s)?'selected':''}>${y}</option>`;return out}function fuelOptions(s){return['Gasolina','Diesel','Híbrido','Híbrido Plug-in','Elétrico','GPL','Outro'].map(f=>`<option value="${f}" ${f===s?'selected':''}>${f}</option>`).join('')}function monthOptions(s){let out='<option value="">Mês</option>';for(let m=1;m<=12;m++){let v=String(m).padStart(2,'0');out+=`<option value="${v}" ${String(s).padStart(2,'0')===v?'selected':''}>${v}</option>`}return out}function updateModelDropdown(){gm.innerHTML=modelOptions(val('gb'),'')}
function screenGarage(){if(isAll())return`<div class="head"><h2>Garagem</h2><button onclick="addCar()">Novo carro</button></div><div class="card"><div class="main">Garage geral</div><div class="sub">Escolhe um carro no topo para editar ou cria um novo.</div><button class="btn" style="margin-top:14px" onclick="addCar()">Adicionar novo carro</button></div>`;let c=car();return`<div class="head"><h2>Garagem</h2><button onclick="addCar()">Novo carro</button></div><div class="card form"><div class="row"><div class="field"><label>Marca</label><select id="gb" onchange="updateModelDropdown()">${brandOptions(c.brand)}</select></div><div class="field"><label>Modelo</label><select id="gm">${modelOptions(c.brand,c.model)}</select></div></div><div class="field"><label>Km atuais</label><input id="go" type="number" value="${c.odo||''}"></div><div class="row"><div class="field"><label>Ano</label><select id="gy">${yearOptions(c.year)}</select></div><div class="field"><label>Combustível</label><select id="gf">${fuelOptions(c.fuel)}</select></div></div><div class="field"><label>Cor do carro</label><input id="gcolor" type="color" value="${c.color||'#f7c948'}"></div><div class="row"><div class="field"><label>Matrícula</label><input id="gp" value="${c.plate}"></div><div class="field"><label>Mês matrícula</label><select id="grm">${monthOptions(c.regMonth)}</select></div></div><div class="row"><div class="field"><label>Oil check interval km</label><input id="goilkm" type="number" value="${c.oilIntervalKm||1000}" placeholder="ex: 1000"></div><div class="field"><label>Preferred oil type</label><select id="goiltype">${oilTypeOptions(c.oilType||'5W30')}</select></div></div><div class="row"><div class="field"><label>Seguro - pago em</label><input id="gi" type="date" value="${c.insurance}"></div><div class="field"><label>Seguro - valor €</label><input id="giv" type="number" step="0.01" value="${c.insuranceValue||''}"></div></div><div class="row"><div class="field"><label>Inspeção - realizada em</label><input id="gip" type="date" value="${c.inspection}"></div><div class="field"><label>Inspeção - valor €</label><input id="gipv" type="number" step="0.01" value="${c.inspectionValue||''}"></div></div><div class="row"><div class="field"><label>IUC - pago em</label><input id="gu" type="date" value="${c.iuc}"></div><div class="field"><label>IUC - valor €</label><input id="guv" type="number" step="0.01" value="${c.iucValue||''}"></div></div><div class="calc"><span>Validade automática</span><strong>+ 1 ano</strong><div class="sub">Exemplo: pago em 01/05/2026 fica válido até 01/05/2027.</div></div><button class="btn" onclick="saveGarage()">Guardar alterações</button></div>`}
function render(){renderTop();document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+current)?.classList.add('active');content.innerHTML=({overview:screenOverview,fuel:screenFuel,service:screenService,costs:screenCosts,garage:screenGarage}[current]||screenOverview)()}function openKmBox(){if(isAll())return toast('Escolhe primeiro um carro.');current='overview';openKm=true;console.assert(Array.isArray(S.oilLogs),'oilLogs exists');render();setTimeout(previewKm,0)}function previewKm(){let c=car(),n=num('kmNewTotal'),p=document.getElementById('kmPreview');if(!p)return;if(!n){p.textContent='Atual: '+km(c.odo)+' km';return}let d=n-c.odo;p.textContent=d<0?'Novo total inferior ao atual':`${km(c.odo)} km → ${km(n)} km = ${km(d)} km feitos`}function saveKmLog(){let c=car(),n=num('kmNewTotal');if(!n)return toast('Indica o novo odómetro total');let d=n-c.odo;if(d<0)return toast('O novo odómetro não pode ser inferior ao atual');if(d===0)return toast('O odómetro não mudou');S.kmLogs.unshift({id:'k'+Date.now(),carId:c.id,date:val('kmDate')||today(),kmDone:d,odoBefore:c.odo,odoAfter:n,comment:val('kmComment')});c.odo=n;openKm=false;save();render();toast('KM atualizados')}function openOilBox(){if(isAll())return toast('Escolhe primeiro um carro.');current='overview';editingOilId=null;openOil=true;render()}function editOilLog(id){if(isAll())return toast('Escolhe primeiro um carro.');if(!S.oilLogs.find(x=>String(x.id)===String(id)))return toast('Registo não encontrado');current='overview';editingOilId=id;openOil=true;render();setTimeout(()=>document.getElementById('oilDate')?.scrollIntoView({behavior:'smooth',block:'center'}),60)}function cancelOilEdit(){editingOilId=null;openOil=false;render()}function toggleOilAdded(){let box=document.getElementById('oilAddedBox');if(box)box.classList.toggle('collapsed',!document.getElementById('oilAdded').checked)}function saveOilLog(){let c=car(),odo=num('oilOdo');if(!odo)return toast('Indica os KM atuais');let added=!!document.getElementById('oilAdded')?.checked,qty=added?num('oilQty'):0;if(added&&!qty)return toast('Indica a quantidade adicionada');let payload={carId:c.id,date:val('oilDate')||today(),odo,level:val('oilLevel')||'OK',added,quantity:qty,oilType:val('oilType')||c.oilType||'5W30',comment:val('oilComment')};if(editingOilId){let x=S.oilLogs.find(o=>String(o.id)===String(editingOilId));if(!x)return toast('Registo não encontrado');Object.assign(x,payload);toast('Oil check atualizado')}else{S.oilLogs.unshift(Object.assign({id:'o'+Date.now()},payload));toast('Oil check guardado · alerta reiniciado')}c.odo=Math.max(c.odo,odo);editingOilId=null;openOil=false;save();render()}function openFuel(){if(isAll())return toast('Escolhe primeiro um carro.');current='fuel';editingFuelId=null;openFuelForm=true;render();setTimeout(calcFuel,0)}function openService(){if(isAll())return toast('Escolhe primeiro um carro.');current='service';openServiceForm=true;render()}function openExtra(){if(isAll())return toast('Escolhe primeiro um carro.');current='service';openExtraForm=true;render()}function calcFuel(){let l=num('fl'),g=num('ft'),c=document.getElementById('fHasDisc')?.checked?num('fDisc'):0,d=l*(c/100),total=Math.max(0,g-d);if(fuelTotalPreview)fuelTotalPreview.textContent=(l&&g)?(total/l).toFixed(3)+' €/L':'— €/L';if(fuelDiscPreview)fuelDiscPreview.textContent=(l&&g&&c)?`${money(d)} poupados · ${money(total)} final`:'—';}
function toggleDiscount(){fuelDiscBox.classList.toggle('collapsed',!fHasDisc.checked);calcFuel()}function saveFuelEntry(){let c=car(),l=num('fl'),g=num('ft'),odo=num('fo');if(!l||!g||!odo)return toast('Preenche litros, total e odómetro');let has=!!fHasDisc.checked,cent=has?num('fDisc'):0,disc=has?l*(cent/100):0;if(disc>=g)return toast('Desconto inválido');let total=g-disc,payload={carId:c.id,date:val('fd')||today(),odo,literals:undefined,liters:l,total,ppl:total/l,station:val('fs'),hasDiscount:has,discCents:cent,saved:disc,fullPpl:g/l,fullTotal:g,savedKm:num('fSavedKm')||0,carAvg:num('fCarAvg')||0,fullTank:(document.querySelector('input[name="fuelFillType"]:checked')?.value||'full')==='full'};if(editingFuelId){let x=S.fuel.find(f=>String(f.id)===String(editingFuelId));if(!x)return toast('Abastecimento não encontrado');Object.assign(x,payload);toast('Abastecimento atualizado')}else{S.fuel.unshift(Object.assign({id:'f'+Date.now()},payload));toast('Abastecimento guardado')}c.odo=Math.max(c.odo,odo);editingFuelId=null;openFuelForm=false;save();render()}
function addFuel(){saveFuelEntry()}function addService(){let c=car(),odo=num('so'),cost=num('sc'),note=val('st'),selected=[...document.querySelectorAll('input[name="serviceItem"]:checked')].map(x=>x.value);if(!odo||!cost)return toast('Preenche custo e odómetro');if(!selected.length&&!note)return toast('Seleciona pelo menos um item ou escreve uma nota');S.service.unshift({id:'s'+Date.now(),carId:c.id,date:val('sd'),odo,title:[...selected,note].filter(Boolean).join(' + '),garage:val('sw'),cost,next:num('sn')||0,items:selected,note});c.odo=Math.max(c.odo,odo);openServiceForm=false;save();render();toast('Serviço guardado')}function addExtra(){let c=car(),odo=num('xo'),ml=num('xml'),cost=num('xc'),dur=num('xk'),type=val('xt');if(!odo||!ml||!cost||!dur)return toast('Preenche todos os campos');let title=(extraNames.find(e=>e[0]===type)||['',type])[1];S.extras.unshift({id:'x'+Date.now(),carId:c.id,type,title,date:val('xd'),odo,ml,cost,dur,until:odo+dur});c.odo=Math.max(c.odo,odo);openExtraForm=false;save();render();toast('Extra guardado')}function saveGarage(){let c=car();Object.assign(c,{brand:val('gb'),model:val('gm'),odo:num('go'),year:val('gy'),fuel:val('gf'),color:val('gcolor')||'#f7c948',plate:val('gp'),regMonth:val('grm'),insurance:val('gi'),insuranceValue:num('giv'),inspection:val('gip'),inspectionValue:num('gipv'),iuc:val('gu'),iucValue:num('guv'),oilIntervalKm:num('goilkm')||1000,oilType:val('goiltype')||'5W30'});save();render();toast('Garagem guardada')}function addCar(){let id='car'+Date.now();S.cars.push({id,brand:'BMW',model:'X1',year:'',fuel:'Diesel',color:'#f7c948',plate:'',regMonth:'',odo:0,insurance:'',inspection:'',iuc:'',insuranceValue:0,inspectionValue:0,iucValue:0,oilIntervalKm:1000,oilType:'5W30'});S.active=id;current='garage';save();render();toast('Novo carro criado')}function editFuel(id){let x=S.fuel.find(f=>String(f.id)===String(id));if(!x)return toast('Abastecimento não encontrado');current='fuel';editingFuelId=id;openFuelForm=true;render();setTimeout(()=>{calcFuel();document.getElementById('fd')?.scrollIntoView({behavior:'smooth',block:'center'});},60)}function cancelFuelEdit(){editingFuelId=null;openFuelForm=false;render()}function removeFrom(type,id){if(!confirm('Queres mesmo remover este registo?'))return;S[type]=S[type].filter(x=>String(x.id)!==String(id));save();render();toast('Registo removido')}function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='autolog-backup.json';a.click();URL.revokeObjectURL(a.href)}function resetApp(){if(!confirm('Queres mesmo fazer reset à app? Todos os dados locais serão apagados.'))return;localStorage.removeItem(KEY);S=makeDefault();current='overview';openKm=openOil=openFuelForm=openServiceForm=openExtraForm=false;editingOilId=null;editingFuelId=null;save();render();toast('App reiniciada')}console.assert(typeof openOilBox==='function','openOilBox exists');console.assert(typeof oilStatusCard==='function','oilStatusCard exists');console.assert(typeof saveOilLog==='function','saveOilLog exists');
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function importData(ev){let file=ev.target.files&&ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data||!Array.isArray(data.cars))throw new Error('bad');localStorage.setItem(KEY,JSON.stringify(data));S=load();current='overview';save();render();toast('Backup importado com sucesso')}catch(e){toast('Ficheiro de backup inválido')}};r.readAsText(file);ev.target.value=''}
window.addEventListener('scroll',()=>{let b=document.getElementById('backTop');if(b)b.classList.toggle('show',window.scrollY>420)},{passive:true});

render();
</script></body></html>
